name: sistema-modalidad

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-sistema_modalidad}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5540:5432"
    volumes:
      - sistema_modalidad_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sistema_modalidad}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DJANGO_ENV: development
      SECRET_KEY: ${SECRET_KEY:-django-insecure-default}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: ${DB_NAME:-sistema_modalidad}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-15174},http://127.0.0.1:${FRONTEND_PORT:-15174}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-19001}:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-19001}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-15174}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  sistema_modalidad_data:
    name: sistemademodalidad_sistema_modalidad_data
    external: true
