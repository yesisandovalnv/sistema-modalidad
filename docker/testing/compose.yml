name: sistema-modalidad-test

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env.test}
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER in .env.test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env.test}
    ports:
      - "127.0.0.1:5541:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

volumes:
  test_pgdata:

networks:
  test_network:
    driver: bridge
