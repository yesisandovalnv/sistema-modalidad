      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: seguimiento_etapa
        schema:
          type: integer
      - in: query
        name: tipo_participacion
        schema:
          type: string
          title: Tipo de participación
          enum:
          - DOCENTE_MODALIDAD
          - PRESIDENTE
          - SECRETARIO
          - TRIBUNAL
          - TUTOR
        description: |-
          Código técnico del sistema fundamentado en los actores del reglamento y el diagrama oficial.

          * `TUTOR` - Tutor
          * `TRIBUNAL` - Tribunal
          * `DOCENTE_MODALIDAD` - Docente de modalidad
          * `PRESIDENTE` - Presidente
          * `SECRETARIO` - Secretario
      - in: query
        name: usuario
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAsignacionPostulacionList'
          description: ''
