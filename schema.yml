components:
  schemas:
    AprobarDocumento:
      type: object
      description: Serializador para la aprobación de un documento.
      properties:
        comentario:
          type: string
          nullable: true
    DocumentoPostulacion:
      type: object
      description: Serializador para documentos de postulación, incluyendo sus versiones
        anidadas.
      properties:
        id:
          type: integer
          readOnly: true
        postulacion:
          type: integer
          title: Postulación
        tipo_documento:
          type: integer
          title: Tipo de documento
        estado:
          type: integer
        fecha_subida:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de subida
        fecha_revision:
          type: string
          format: date-time
          nullable: true
          title: Fecha de revisión
        observacion_general:
          type: string
          nullable: true
          title: Observación general
        requiere_correccion:
          type: boolean
          title: Requiere corrección
        versiones:
          type: array
          items:
            $ref: '#/components/schemas/VersionDocumento'
          readOnly: true
        activo:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de actualización
      required:
      - activo
      - created_at
      - estado
      - fecha_subida
      - id
      - postulacion
      - tipo_documento
      - updated_at
      - versiones
    EstadoDocumento:
      type: object
      description: Serializador para los estados de documento.
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          title: Código
          maxLength: 30
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
          title: Descripción
        activo:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de actualización
      required:
      - activo
      - codigo
      - created_at
      - id
      - nombre
      - updated_at
    EstadoPostulacion:
      type: object
      description: Serializer para exponer el catálogo maestro de estados de postulación.
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          title: Código
          maxLength: 30
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
          title: Descripción
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - codigo
      - created_at
      - id
      - nombre
      - updated_at
    HistorialEstado:
      type: object
      description: Serializer para registrar el historial de cambios de estado de
        una postulación.
      properties:
        id:
          type: integer
          readOnly: true
        postulacion:
          type: integer
          title: Postulación
        estado_anterior:
          type: integer
          nullable: true
        estado_nuevo:
          type: integer
        usuario:
          type: integer
        fecha_cambio:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de cambio
        comentario:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - created_at
      - estado_nuevo
      - fecha_cambio
      - id
      - postulacion
      - updated_at
      - usuario
    Login:
      type: object
      description: Serializer para autenticar usuarios con username y password.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      description: Serializer para recibir el refresh token en el cierre de sesión.
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    Modalidad:
      type: object
      description: Serializer para exponer y validar las modalidades académicas.
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          title: Código
          maxLength: 20
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
          nullable: true
          title: Descripción
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - codigo
      - created_at
      - id
      - nombre
      - updated_at
    ModalidadRequisito:
