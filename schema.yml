        etapas:
          type: array
          items: {}
        estados:
          type: array
          items: {}
        documentos:
          type: object
          additionalProperties: {}
        defensas:
          type: object
          additionalProperties: {}
        cierre:
          type: object
          additionalProperties: {}
        notificaciones:
          type: object
          additionalProperties: {}
        tendencia:
          type: array
          items: {}
        advertencias:
          type: array
          items: {}
      required:
      - advertencias
      - cierre
      - defensas
      - documentos
      - estados
      - etapas
      - filtros_aplicados
      - modalidades
      - notificaciones
      - resumen
      - tendencia
    DocumentoPostulacion:
      type: object
