  /api/v1/asignaciones/:
    get:
      operationId: v1_asignaciones_list
      description: ViewSet para consultar asignaciones y ejecutar acciones explícitas
        de gestión.
      parameters:
      - in: query
        name: activo
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
