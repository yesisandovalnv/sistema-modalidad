components:
  schemas:
    ActorResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        username:
          type: string
      required:
      - id
      - nombre
      - username
    AprobarDocumento:
      type: object
      description: Serializador para la aprobación de un documento.
      properties:
        comentario:
          type: string
          nullable: true
    AprobarSeguimientoEtapa:
      type: object
      description: Payload para aprobar una etapa.
      properties:
        observaciones:
          type: string
          default: ''
    AsignacionPostulacion:
      type: object
      description: Serializer de solo lectura para asignaciones de actores en postulaciones.
      properties:
        id:
          type: integer
          readOnly: true
        postulacion:
          type: integer
          readOnly: true
          title: Postulación
        usuario:
          type: integer
          readOnly: true
          title: Usuario asignado
        usuario_nombre_completo:
          type: string
          readOnly: true
        tipo_participacion:
          allOf:
          - $ref: '#/components/schemas/TipoParticipacionEnum'
          readOnly: true
          title: Tipo de participación
          description: |-
            Código técnico del sistema fundamentado en los actores del reglamento y el diagrama oficial.

            * `TUTOR` - Tutor
            * `TRIBUNAL` - Tribunal
            * `DOCENTE_MODALIDAD` - Docente de modalidad
            * `PRESIDENTE` - Presidente
            * `SECRETARIO` - Secretario
        tipo_participacion_nombre:
          type: string
          readOnly: true
        orden_cargo:
          type: integer
          readOnly: true
          nullable: true
          title: Orden del cargo
        seguimiento_etapa:
          type: integer
          readOnly: true
          nullable: true
          title: Seguimiento de etapa
        etapa_id:
          type: integer
          readOnly: true
        etapa_codigo:
          type: string
          readOnly: true
        etapa_nombre:
          type: string
          readOnly: true
        fecha_designacion:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de designación
        fecha_finalizacion:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fecha de finalización
        activo:
          type: boolean
          readOnly: true
        designado_por:
          type: integer
          readOnly: true
          nullable: true
        designado_por_nombre:
          type: string
          readOnly: true
        observaciones:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activo
      - created_at
      - designado_por
      - designado_por_nombre
      - etapa_codigo
      - etapa_id
      - etapa_nombre
      - fecha_designacion
      - fecha_finalizacion
      - id
      - observaciones
      - orden_cargo
      - postulacion
      - seguimiento_etapa
      - tipo_participacion
      - tipo_participacion_nombre
      - updated_at
      - usuario
      - usuario_nombre_completo
    AsignarActor:
      type: object
      description: Payload para asignar un actor a una postulación.
      properties:
        usuario:
          type: integer
        tipo_participacion:
          $ref: '#/components/schemas/TipoParticipacionEnum'
        orden_cargo:
          type: integer
          minimum: 1
          nullable: true
        seguimiento_etapa:
          type: integer
          nullable: true
        observaciones:
          type: string
          default: ''
      required:
      - tipo_participacion
      - usuario
    AuthenticatedRole:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
      required:
      - codigo
      - nombre
    BlankEnum:
      enum:
      - ''
    CierreEstado:
      type: object
      properties:
        postulacion_id:
          type: integer
        modalidad:
          type: string
        estado_general:
          type: string
          nullable: true
        etapa_actual:
          type: string
          nullable: true
        defensa_publica_aprobada:
          type: boolean
        revision_final_aprobada:
          type: boolean
        cierre_documental_aprobado:
          type: boolean
        condiciones_requeridas:
          type: array
          items: {}
        condiciones_cumplidas:
          type: array
          items: {}
        condiciones_faltantes:
          type: array
          items: {}
        entregas_requeridas:
          type: array
          items: {}
        entregas_completas:
          type: array
          items: {}
        entregas_faltantes:
          type: array
          items: {}
        documentos_requeridos:
          type: array
          items: {}
        documentos_aprobados:
          type: array
          items: {}
        documentos_faltantes:
          type: array
          items: {}
        advertencias_normativas:
          type: array
          items: {}
        puede_aprobar_revision_final:
          type: boolean
        puede_aprobar_cierre:
          type: boolean
        puede_concluir:
          type: boolean
        concluida:
          type: boolean
      required:
      - advertencias_normativas
      - cierre_documental_aprobado
      - concluida
      - condiciones_cumplidas
      - condiciones_faltantes
      - condiciones_requeridas
      - defensa_publica_aprobada
      - documentos_aprobados
      - documentos_faltantes
      - documentos_requeridos
      - entregas_completas
      - entregas_faltantes
      - entregas_requeridas
      - estado_general
      - etapa_actual
      - modalidad
      - postulacion_id
      - puede_aprobar_cierre
      - puede_aprobar_revision_final
      - puede_concluir
      - revision_final_aprobada
    CierreObservacion:
      type: object
      properties:
        observaciones:
          type: string
          default: ''
    Codigo139Enum:
      enum:
      - PLAN_ESTUDIOS
      - ADMISION_COMPLETA
      - SOLVENCIA_UNIVERSITARIA
      - SOLVENCIA_BIBLIOTECA
      - MATRICULA_VIGENTE
      - PLAZO_MAXIMO
      type: string
      description: |-
        * `PLAN_ESTUDIOS` - Plan de estudios
        * `ADMISION_COMPLETA` - Admisión completa
        * `SOLVENCIA_UNIVERSITARIA` - Solvencia universitaria
        * `SOLVENCIA_BIBLIOTECA` - Solvencia de biblioteca
        * `MATRICULA_VIGENTE` - Matrícula vigente
        * `PLAZO_MAXIMO` - Plazo máximo
    Condicion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de actualización
        activo:
          type: boolean
          readOnly: true
        codigo:
          $ref: '#/components/schemas/Codigo139Enum'
        nombre:
          type: string
          maxLength: 150
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        estado:
          allOf:
          - $ref: '#/components/schemas/CondicionEstadoEnum'
          readOnly: true
        fecha_verificacion:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        observaciones:
          type: string
        postulacion:
          type: integer
        verificado_por:
          type: integer
          readOnly: true
          nullable: true
      required:
      - activo
      - codigo
      - created_at
      - estado
      - fecha_verificacion
      - id
      - nombre
      - postulacion
      - tipo
      - updated_at
      - verificado_por
    CondicionEstadoEnum:
      enum:
      - PENDIENTE
      - CUMPLE
      - NO_CUMPLE
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `CUMPLE` - Cumple
        * `NO_CUMPLE` - No cumple
    Dashboard:
